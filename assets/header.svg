<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Vardh Jain — Machine Learning Engineer</title>
  <desc id="desc">Build it. Measure it. Make it useful. A diagram connects context, tools, and evidence.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#09121f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#67e8c4" stop-opacity=".10"/><stop offset="1" stop-color="#67e8c4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9bb4cc" stroke-opacity=".055"/></pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
      .signal{stroke-dasharray:6 16;animation:flow 9s linear infinite}.ring{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-176}}@keyframes breathe{50%{opacity:.3}}
      @media(prefers-reduced-motion:reduce){.signal,.ring{animation:none}}
    </style>
  </defs>
  <rect width="900" height="320" rx="20" fill="url(#bg)"/>
  <rect width="900" height="320" rx="20" fill="url(#grid)"/>
  <ellipse cx="720" cy="180" rx="220" ry="180" fill="url(#glow)"/>
  <path d="M40 37h28" stroke="#67e8c4" stroke-width="3"/>
  <text x="80" y="42" fill="#bdcddd" font-size="12" letter-spacing="2.5" class="mono">VARDH JAIN / ML ENGINEER</text>
  <text x="40" y="112" fill="#f2f6fc" font-size="48" font-weight="700" letter-spacing="-1.7">Build it.</text>
  <text x="40" y="167" fill="#f2f6fc" font-size="48" font-weight="700" letter-spacing="-1.7">Measure it.</text>
  <text x="40" y="222" fill="#67e8c4" font-size="48" font-weight="700" letter-spacing="-1.7">Make it useful.</text>
  <text x="42" y="282" fill="#a7bbcf" font-size="13" letter-spacing=".25">AGENT TOOLING / RETRIEVAL / RESPONSIBLE ML</text>
  <g fill="none" stroke="#355268" stroke-width="1.5">
    <path d="M588 95L776 155 620 234 588 95Z"/>
    <path d="M588 95L678 164 776 155M678 164L620 234"/>
    <circle cx="678" cy="164" r="68" stroke-opacity=".3"/>
    <circle cx="678" cy="164" r="107" stroke-opacity=".18"/>
  </g>
  <path class="signal" d="M588 95L776 155 620 234 588 95" fill="none" stroke="#67e8c4" stroke-width="2" opacity=".8"/>
  <g fill="#101f30" stroke="#67e8c4" stroke-width="1.5">
    <circle cx="588" cy="95" r="9"/><circle cx="776" cy="155" r="9"/><circle cx="620" cy="234" r="9"/>
    <circle cx="678" cy="164" r="5" fill="#67e8c4"/>
    <circle class="ring" cx="678" cy="164" r="15" opacity=".7"/>
  </g>
  <g font-size="11" letter-spacing="1.6" fill="#c0d3e4" class="mono">
    <text x="552" y="70">CONTEXT</text><text x="761" y="187">TOOLS</text><text x="581" y="267">EVIDENCE</text>
  </g>
  <text x="752" y="42" fill="#748fa7" font-size="11" letter-spacing="1.5" class="mono">LESS GUESSWORK.</text>
</svg>
