<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
  <title id="title">Vardh Jain — Machine Learning Engineer</title>
  <desc id="desc">Build it. Measure it. Make it useful. Agent tooling, retrieval, and responsible machine learning.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f35"/><stop offset="1" stop-color="#09121f"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9bb4cc" stroke-opacity=".055"/></pattern>
    <style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.signal{stroke-dasharray:6 16;animation:flow 9s linear infinite}@keyframes flow{to{stroke-dashoffset:-176}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style>
  </defs>
  <rect width="440" height="300" rx="18" fill="url(#bg)"/>
  <rect width="440" height="300" rx="18" fill="url(#grid)"/>
  <path d="M26 31h22" stroke="#67e8c4" stroke-width="3"/>
  <text x="60" y="35" fill="#bdcddd" font-size="11" letter-spacing="1.2" class="mono">VARDH JAIN / ML ENGINEER</text>
  <g font-size="43" font-weight="700" letter-spacing="-1.5">
    <text x="26" y="99" fill="#f2f6fc">Build it.</text>
    <text x="26" y="148" fill="#f2f6fc">Measure it.</text>
    <text x="26" y="197" fill="#67e8c4">Make it useful.</text>
  </g>
  <path d="M27 230h386" stroke="#355268"/>
  <path class="signal" d="M27 230h386" stroke="#67e8c4" opacity=".8"/>
  <text x="26" y="258" fill="#a7bbcf" font-size="11" letter-spacing=".3" class="mono">AGENT TOOLING / RETRIEVAL</text>
  <text x="26" y="278" fill="#a7bbcf" font-size="11" letter-spacing=".3" class="mono">RESPONSIBLE ML</text>
</svg>
